name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ClaudeProcessTests drive a fake Claude CLI written in JavaScript.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: dotnet build Buddy.sln -c Release

      - name: Test
        run: dotnet test Buddy.sln -c Release --no-build --logger "console;verbosity=normal"
