name: Release

# A tag like v1.4.0 builds Buddy for Windows and Linux and attaches the zips to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: dotnet test Buddy.sln -c Release

      # Self-contained: runs without installing .NET. BuddyRelease leaves out the link to the sources.
      - name: Publish
        run: dotnet publish src/Buddy.App/Buddy.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:BuddyRelease=true -o out/Buddy

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path out/Buddy -DestinationPath Buddy-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: cd out && zip -qr ../Buddy-${{ github.ref_name }}-${{ matrix.rid }}.zip Buddy

      - uses: softprops/action-gh-release@v2
        with:
          files: Buddy-${{ github.ref_name }}-${{ matrix.rid }}.zip
          generate_release_notes: true
